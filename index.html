<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask2Chart - Explore CSVs and build charts</title>
  <meta name="description"
    content="Open a CSV, ask your data a question, and build charts you can inspect, export, and pin to a dashboard." />
  <link rel="icon" href="/brand/ask2chart-mark-black.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="/brand/ask2chart-mark-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
  <script>
    // Apply the saved appearance before the app and its styles load
    (() => {
      let theme;
      try {
        theme = localStorage.getItem("ask2chart-theme");
      } catch {
        // Fall back to the system appearance if storage is blocked
      }
      const dark =
        theme === "dark" ||
        (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
    }

    :root.dark {
      color-scheme: dark;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
